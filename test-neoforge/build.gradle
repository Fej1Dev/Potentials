architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    mods {
        potentials {
            sourceSet project(':neoforge').sourceSets.main
        }
    }
}

configurations {
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    exclusiveContent {
        forRepository {
            maven { url "https://cursemaven.com" }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Compile-only: the mods block provides these via source set outputs at dev-run time.
    // Keeping them on the runtime module path would create split-package conflicts because
    // :neoforge's shadow jar already bundles :common's packages.
    compileOnly project(path: ':neoforge')
    compileOnly project(path: ':common')

    // test-common lives in the test.* package space — no overlap with com.fej1fun.potentials.*,
    // so it can safely be its own module on the runtime path without split-package conflicts.
    common(project(path: ':test-common')) { transitive = false }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
}
