import groovy.json.JsonSlurper

plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.2' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'architectury-plugin'

    group = rootProject.maven_group
    version = rootProject.mod_version

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'maven-publish'

    boolean isCommon = project.name == 'common' || project.name == 'test-common'
    boolean isTest = project.name.startsWith('test-')

    base {
        archivesName = "${rootProject.mod_id}-${project.name}-${rootProject.minecraft_version}"
    }

    repositories {
        mavenLocal()
        maven { url = "https://maven.saps.dev/minecraft" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    // Loader-specific subprojects (fabric, neoforge, test-fabric, test-neoforge) need
    // shadow to bundle common classes into a single jar.
    if (!isCommon) {
        apply plugin: 'com.gradleup.shadow'

        configurations {
            common {
                canBeResolved = true
                canBeConsumed = false
            }
            shadowCommon {
                canBeResolved = true
                canBeConsumed = false
            }
            compileClasspath.extendsFrom common
            runtimeClasspath.extendsFrom common
        }

        jar {
            archiveClassifier = 'raw'
        }

        shadowJar {
            dependsOn jar
            mainSpec.sourcePaths.clear()
            from(zipTree(jar.archiveFile))
            configurations = [project.configurations.shadowCommon]
            archiveClassifier = null
            zip64 = true
        }

        assemble.dependsOn shadowJar
    }

    // Only the production subprojects (common, fabric, neoforge) are published.
    if (!isTest) {
        apply plugin: 'me.modmuss50.mod-publish-plugin'

        // Expose the shadowed jar as the Maven outgoing artifact so dependents
        // (and the publish tasks) receive the fully-bundled jar, not the raw one.
        if (!isCommon) {
            configurations {
                apiElements {
                    outgoing.artifacts.clear()
                    outgoing.artifact(project.tasks.shadowJar)
                }
                runtimeElements {
                    outgoing.artifacts.clear()
                    outgoing.artifact(project.tasks.shadowJar)
                }
            }
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    groupId "com.fej1fun.potentials"
                    artifactId "potentials-${project.name}-${rootProject.minecraft_version}"
                    version rootProject.mod_version
                    from components.java
                    pom {
                        name = "Potentials ${project.name.capitalize()}"
                        url = "https://github.com/Fej1Dev/Potentials"
                    }
                }
            }
            repositories {
                maven {
                    name = "ExodusStudio"
                    url = "https://maven.exodusstudio.org/releases"
                    credentials {
                        username = System.getenv("EXODUS_MAVEN_USERNAME")
                        password = System.getenv("EXODUS_MAVEN_KEY")
                    }
                }
            }
        }

        if (!isCommon) {
            publishMods {
                def supported_versions = new JsonSlurper()
                        .parseText("${rootProject.supported_minecraft_versions}")
                        .versions

                file = project.tasks.shadowJar.archiveFile
                changelog = rootProject.file("changelog.md").getText('UTF-8')
                type = rootProject.release_type == 'alpha' ? ALPHA
                     : rootProject.release_type == 'beta'  ? BETA
                     : STABLE
                modLoaders.add(project.name)
                displayName = "[${project.name.capitalize()} ${rootProject.minecraft_version}] Potentials ${rootProject.mod_version}"

                curseforge {
                    projectId = "1165185"
                    projectSlug = "potentials"
                    accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
                    for (String ver : supported_versions)
                        minecraftVersions.add(ver)
                    javaVersions.add(JavaVersion.VERSION_21)
                    requires("architectury-api")
                    if (project.name == "fabric") requires("fabric-api")
                    client = true
                    server = true
                }

                modrinth {
                    projectId = "J9pKOkxP"
                    accessToken = providers.environmentVariable("MODRINTH_TOKEN")
                    for (String ver : supported_versions)
                        minecraftVersions.add(ver)
                    requires("architectury-api")
                    if (project.name == "fabric") requires("fabric-api")
                }
            }
        }
    }
}
